<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadowAi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="840" height="400" rx="16" fill="url(#bgAi)" />
  <rect x="1" y="1" width="838" height="398" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="45" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1">LOCAL AI SERVER &amp; CONTAINER ARCHITECTURE</text>
  <text x="40" y="68" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Linux Host, Docker Bridge Network, Ollama Inference API, Open WebUI &amp; Persistent Volumes</text>

  <!-- Linux Host Outer Boundary -->
  <rect x="30" y="90" width="780" height="215" rx="12" fill="#111827" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.9"/>
  <text x="50" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">LINUX HOST (Ubuntu / Docker Engine v24+ / systemd)</text>

  <!-- Browser Client Node -->
  <g transform="translate(50, 130)" filter="url(#shadowAi)">
    <rect width="180" height="155" rx="10" fill="url(#cardAi)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="90" cy="45" r="22" fill="#0284c7" opacity="0.3"/>
    <!-- Web Browser Screen -->
    <rect x="74" y="32" width="32" height="24" rx="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="74" y1="39" x2="106" y2="39" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="86" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Open WebUI</text>
    <text x="90" y="105" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Port 3000 (HTTP/TLS)</text>
    <text x="90" y="122" font-family="-apple-system, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Chat UI &amp; Auth</text>
    <rect x="25" y="132" width="130" height="15" rx="7.5" fill="#0284c7" opacity="0.2"/>
    <text x="90" y="143" font-family="-apple-system, sans-serif" font-size="8.5" fill="#38bdf8" text-anchor="middle">Container 1 (Frontend)</text>
  </g>

  <!-- Docker Bridge Connection -->
  <g transform="translate(235, 205)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 3"/>
    <polygon points="80,-5 90,0 80,5" fill="#10b981"/>
    <polygon points="10,-5 0,0 10,5" fill="#10b981"/>
    <text x="45" y="-10" font-family="-apple-system, sans-serif" font-size="9.5" fill="#34d399" text-anchor="middle">Docker Bridge Net</text>
    <text x="45" y="16" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">ollama:11434 API</text>
  </g>

  <!-- Ollama Backend Node -->
  <g transform="translate(330, 130)" filter="url(#shadowAi)">
    <rect width="195" height="155" rx="10" fill="url(#cardAi)" stroke="#10b981" stroke-width="2"/>
    <circle cx="97" cy="45" r="22" fill="#047857" opacity="0.3"/>
    <!-- CPU/AI chip -->
    <rect x="85" y="33" width="24" height="24" rx="4" fill="none" stroke="#34d399" stroke-width="2"/>
    <rect x="91" y="39" width="12" height="12" fill="#34d399"/>
    <text x="97" y="86" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Ollama LLM Engine</text>
    <text x="97" y="105" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Local Inference API</text>
    <text x="97" y="122" font-family="-apple-system, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">GGUF Quantized Models</text>
    <rect x="25" y="132" width="145" height="15" rx="7.5" fill="#10b981" opacity="0.2"/>
    <text x="97" y="143" font-family="-apple-system, sans-serif" font-size="8.5" fill="#34d399" text-anchor="middle">Container 2 (Backend)</text>
  </g>

  <!-- Arrow to Storage -->
  <g transform="translate(530, 205)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3"/>
    <polygon points="70,-5 80,0 70,5" fill="#f59e0b"/>
    <text x="40" y="-10" font-family="-apple-system, sans-serif" font-size="9.5" fill="#fbbf24" text-anchor="middle">Volume Mount</text>
  </g>

  <!-- Persistent Host Storage & Resources -->
  <g transform="translate(605, 130)" filter="url(#shadowAi)">
    <rect width="185" height="155" rx="10" fill="url(#cardAi)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="92" cy="45" r="22" fill="#b45309" opacity="0.3"/>
    <!-- Hard drive disk -->
    <rect x="76" y="34" width="32" height="22" rx="4" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="92" cy="45" r="4" fill="#fbbf24"/>
    <text x="92" y="86" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Persistent Storage</text>
    <text x="92" y="105" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Named Volumes / Host</text>
    <text x="92" y="122" font-family="-apple-system, sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">CPU/RAM Resource Caps</text>
    <rect x="20" y="132" width="145" height="15" rx="7.5" fill="#f59e0b" opacity="0.2"/>
    <text x="92" y="143" font-family="-apple-system, sans-serif" font-size="8.5" fill="#fbbf24" text-anchor="middle">Survives Reboots</text>
  </g>

  <!-- Controls Footer -->
  <g transform="translate(40, 318)">
    <rect width="760" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-dasharray="3 3"/>
    <text x="25" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Security &amp; Operational Controls:</text>
    <text x="25" y="44" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Ollama port 11434 bound exclusively to Docker bridge (never exposed publicly) • Non-root container privileges • CPU/RAM limits set in Compose</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardAd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadowAd" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="840" height="400" rx="16" fill="url(#bgAd)" />
  <rect x="1" y="1" width="838" height="398" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <text x="40" y="45" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1">ACTIVE DIRECTORY DOMAIN SERVICES LAB ARCHITECTURE</text>
  <text x="40" y="68" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Forest Root, AD DS Role, DNS Integration, OU Hierarchies, Group Policy (GPOs) &amp; Client Domain Joins</text>

  <!-- Domain Controller Node -->
  <g transform="translate(40, 110)" filter="url(#shadowAd)">
    <rect width="220" height="180" rx="12" fill="url(#cardAd)" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="110" cy="50" r="26" fill="#0369a1" opacity="0.3"/>
    <!-- Server Stack Icon -->
    <rect x="94" y="36" width="32" height="10" rx="2" fill="#38bdf8"/>
    <rect x="94" y="49" width="32" height="10" rx="2" fill="#38bdf8"/>
    <rect x="94" y="62" width="32" height="10" rx="2" fill="#38bdf8"/>
    <circle cx="120" cy="41" r="1.5" fill="#10b981"/>
    <circle cx="120" cy="54" r="1.5" fill="#10b981"/>
    <circle cx="120" cy="67" r="1.5" fill="#10b981"/>
    <text x="110" y="98" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Windows Server (DC)</text>
    <text x="110" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AD DS &amp; DNS Server</text>
    <text x="110" y="140" font-family="-apple-system, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Forest / Domain Root</text>
    <rect x="35" y="152" width="150" height="18" rx="9" fill="#0ea5e9" opacity="0.2"/>
    <text x="110" y="165" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle">Kerberos / LDAP / SYSVOL</text>
  </g>

  <!-- Arrow 1: Policy & Identity -->
  <g transform="translate(265, 200)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 3"/>
    <polygon points="65,-5 75,0 65,5" fill="#0ea5e9"/>
    <text x="35" y="-12" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">GPO / Auth</text>
  </g>

  <!-- OU & Policy Node -->
  <g transform="translate(345, 110)" filter="url(#shadowAd)">
    <rect width="200" height="180" rx="12" fill="url(#cardAd)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="100" cy="50" r="26" fill="#7e22ce" opacity="0.3"/>
    <!-- Folder / Tree Icon -->
    <path d="M86 42 h10 l4 4 h16 a2 2 0 0 1 2 2 v18 a2 2 0 0 1 -2 2 h-30 a2 2 0 0 1 -2 -2 v-22 a2 2 0 0 1 2 -2 z" fill="#c084fc"/>
    <text x="100" y="98" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">OU &amp; GPO Hierarchy</text>
    <text x="100" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Identity &amp; Governance</text>
    <text x="100" y="140" font-family="-apple-system, sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">Security Groups &amp; RBAC</text>
    <rect x="25" y="152" width="150" height="18" rx="9" fill="#a855f7" opacity="0.2"/>
    <text x="100" y="165" font-family="-apple-system, sans-serif" font-size="9" fill="#c084fc" text-anchor="middle">Baseline Security Policies</text>
  </g>

  <!-- Arrow 2: Domain Join -->
  <g transform="translate(550, 200)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 3"/>
    <polygon points="65,-5 75,0 65,5" fill="#a855f7"/>
    <text x="35" y="-12" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Domain Join</text>
  </g>

  <!-- Client Workstation Node -->
  <g transform="translate(620, 110)" filter="url(#shadowAd)">
    <rect width="180" height="180" rx="12" fill="url(#cardAd)" stroke="#10b981" stroke-width="2"/>
    <circle cx="90" cy="50" r="26" fill="#047857" opacity="0.3"/>
    <!-- Laptop / Workstation Icon -->
    <rect x="75" y="38" width="30" height="20" rx="2" fill="none" stroke="#34d399" stroke-width="2"/>
    <line x1="70" y1="62" x2="110" y2="62" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <text x="90" y="98" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Client Workstation</text>
    <text x="90" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Windows 10 / 11 VM</text>
    <text x="90" y="140" font-family="-apple-system, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Joined to Lab Domain</text>
    <rect x="20" y="152" width="140" height="18" rx="9" fill="#10b981" opacity="0.2"/>
    <text x="90" y="165" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">GPO Enforced / Authenticated</text>
  </g>

  <!-- Controls Footer -->
  <g transform="translate(40, 315)">
    <rect width="760" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-dasharray="3 3"/>
    <text x="25" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Security &amp; Operational Controls:</text>
    <text x="25" y="44" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">• Isolated virtual network with no external routing • Least-privilege admin delegation • Regular snapshots before schema updates</text>
  </g>
</svg>